version: '3.8'

services:
  interop_backend:
    build:
      context: ./interop_backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/meditrack
      - JWT_SECRET=meditrack_interop_super_secret_jwt_key_2026
      - AI_SERVICE_URL=http://meditrack_ai:8001
    depends_on:
      - mongo

  interop_frontend:
    build:
      context: ./interop_frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - interop_backend

  mock_his:
    build:
      context: ./mock_his
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    depends_on:
      - interop_backend

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
